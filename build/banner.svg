<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-label="GGUF Editor — a desktop editor for GGUF model files">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="gFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="titleFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded background -->
  <rect x="0" y="0" width="1280" height="320" rx="28" fill="url(#bg)"/>

  <!-- Subtle radial glow behind icon -->
  <circle cx="180" cy="160" r="200" fill="url(#glow)"/>

  <!-- Faint model-diagram flow blocks (echoing the app's diagram) -->
  <g stroke="#64748b" stroke-opacity="0.18" fill="#334155" fill-opacity="0.18" stroke-width="2">
    <rect x="420"  y="36"  width="120" height="36" rx="8"/>
    <rect x="420"  y="92"  width="120" height="36" rx="8"/>
    <rect x="420"  y="248" width="120" height="36" rx="8"/>
    <rect x="1140" y="36"  width="110" height="36" rx="8"/>
    <rect x="1140" y="92"  width="110" height="36" rx="8"/>
    <rect x="1140" y="248" width="110" height="36" rx="8"/>
  </g>
  <g fill="#64748b" fill-opacity="0.28">
    <circle cx="434"  cy="54"  r="3"/>
    <circle cx="434"  cy="110" r="3"/>
    <circle cx="434"  cy="266" r="3"/>
    <circle cx="1154" cy="54"  r="3"/>
    <circle cx="1154" cy="110" r="3"/>
    <circle cx="1154" cy="266" r="3"/>
  </g>
  <g stroke="#64748b" stroke-opacity="0.22" stroke-width="2" fill="#64748b" fill-opacity="0.22">
    <line x1="480" y1="72"  x2="480" y2="88"/>
    <polygon points="476,84 484,84 480,92"/>
    <line x1="1195" y1="72" x2="1195" y2="88"/>
    <polygon points="1191,84 1199,84 1195,92"/>
  </g>

  <!-- Icon: rounded square container -->
  <g transform="translate(40,40)">
    <rect x="0" y="0" width="240" height="240" rx="52" fill="url(#bg)"/>
    <rect x="0" y="0" width="240" height="240" rx="52" fill="none" stroke="url(#stroke)" stroke-width="2" stroke-opacity="0.55"/>

    <!-- Modern "G" glyph, same construction as the app icon -->
    <g fill="none" stroke="url(#gFill)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
      <path d="
        M 167 81
        A 57 57 0 1 0 167 161
        L 167 126
        L 129 126
      "/>
    </g>

    <!-- Quantization strip -->
    <g>
      <rect x="69"  y="204" width="14" height="14" rx="3.5" fill="#22d3ee" fill-opacity="0.95"/>
      <rect x="85"  y="204" width="14" height="14" rx="3.5" fill="#38bdf8" fill-opacity="0.9"/>
      <rect x="101" y="204" width="14" height="14" rx="3.5" fill="#818cf8" fill-opacity="0.95"/>
      <rect x="117" y="204" width="14" height="14" rx="3.5" fill="#a78bfa" fill-opacity="0.9"/>
      <rect x="133" y="204" width="14" height="14" rx="3.5" fill="#c084fc" fill-opacity="0.95"/>
      <rect x="149" y="204" width="14" height="14" rx="3.5" fill="#e879f9" fill-opacity="0.9"/>
    </g>
  </g>

  <!-- Title + tagline -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif">
    <text x="320" y="158" font-size="92" font-weight="800" letter-spacing="-2" fill="url(#titleFill)">GGUF Editor</text>
    <text x="324" y="206" font-size="24" font-weight="500" fill="#cbd5e1" fill-opacity="0.9">
      A desktop editor for GGUF model files.
    </text>
    <text x="324" y="240" font-size="18" font-weight="400" fill="#94a3b8" fill-opacity="0.85">
      Inspect metadata · browse tensors · dequantize · edit
    </text>
  </g>

  <!-- Outer border -->
  <rect x="0" y="0" width="1280" height="320" rx="28" fill="none" stroke="url(#stroke)" stroke-width="2" stroke-opacity="0.6"/>
</svg>
